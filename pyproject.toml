[project]
name = "nimly-digital-lock"
version = "0.0.0"
description = "Home Assistant integration for Nimly Zigbee locks on ZHA (version lives in manifest.json)"
requires-python = ">=3.13.2"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "PL", "SIM", "UP", "W"]
ignore = ["E501", "PLR0911", "PLR0913", "PLR2004"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["homeassistant", "custom_components"]
combine-as-imports = true
split-on-trailing-comma = false

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR0917"]
