set_pin:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: nimly_digital_lock
    slot:
      required: true
      example: 3
      selector:
        number:
          min: 1
          max: 999
          mode: box
    pin_code:
      required: true
      example: "123456"
      selector:
        text:
          type: password
    name:
      required: false
      example: "Anna"
      selector:
        text:

clear_pin:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: nimly_digital_lock
    slot:
      required: true
      example: 3
      selector:
        number:
          min: 1
          max: 999
          mode: box

set_slot_name:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: nimly_digital_lock
    slot:
      required: true
      example: 3
      selector:
        number:
          min: 0
          max: 999
          mode: box
    name:
      required: true
      example: "Anna"
      selector:
        text:
