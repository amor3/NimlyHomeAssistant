set_pin:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: nimly_digital_lock
    device_id:
      required: false
      selector:
        device:
          filter:
            - integration: nimly_digital_lock
            - integration: zha
              manufacturer: Onesti Products AS
    slot:
      required: true
      example: 3
      selector:
        number:
          min: 1
          max: 999
          mode: box
    pin_code:
      required: false
      example: "123456"
      selector:
        text:
          type: password
    name:
      required: false
      example: "Anna"
      selector:
        text:
    valid_from:
      required: false
      example: "2026-12-24 08:00:00"
      selector:
        datetime:
    valid_until:
      required: false
      example: "2026-12-24 18:00:00"
      selector:
        datetime:
    valid_for:
      required: false
      example: "48:00:00"
      selector:
        duration:
          enable_day: true
    weekdays:
      required: false
      example: ["mon", "thu"]
      selector:
        select:
          multiple: true
          translation_key: weekday
          options:
            - mon
            - tue
            - wed
            - thu
            - fri
            - sat
            - sun
    start_time:
      required: false
      example: "08:00:00"
      selector:
        time:
    end_time:
      required: false
      example: "16:00:00"
      selector:
        time:
    max_uses:
      required: false
      example: 1
      selector:
        number:
          min: 1
          max: 999
          mode: box

