set_pin:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: nimly_digital_lock
    device_id:
      required: false
      selector:
        device:
          filter:
            - integration: nimly_digital_lock
            - integration: zha
              manufacturer: Onesti Products AS
    slot:
      required: true
      example: 3
      selector:
        number:
          min: 1
          max: 999
          mode: box
    pin_code:
      required: true
      example: "123456"
      selector:
        text:
          type: password
    name:
      required: false
      example: "Anna"
      selector:
        text:
    valid_until:
      required: false
      example: "2026-12-24 18:00:00"
      selector:
        datetime:
    valid_for:
      required: false
      example: "48:00:00"
      selector:
        duration:
          enable_day: true

clear_pin:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: nimly_digital_lock
    device_id:
      required: false
      selector:
        device:
          filter:
            - integration: nimly_digital_lock
            - integration: zha
              manufacturer: Onesti Products AS
    slot:
      required: true
      example: 3
      selector:
        number:
          min: 1
          max: 999
          mode: box

set_slot_name:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: nimly_digital_lock
    device_id:
      required: false
      selector:
        device:
          filter:
            - integration: nimly_digital_lock
            - integration: zha
              manufacturer: Onesti Products AS
    slot:
      required: true
      example: 3
      selector:
        number:
          min: 0
          max: 999
          mode: box
    name:
      required: true
      example: "Anna"
      selector:
        text:
    credential:
      required: false
      selector:
        select:
          translation_key: credential
          options:
            - pin
            - rfid
            - fingerprint
